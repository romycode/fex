name: Linux beta

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libvulkan-dev libfontconfig-dev libzstd-dev pkg-config clang cmake mesa-vulkan-drivers
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Test
        run: cargo +1.98.1 test --locked
      - name: Test UI with software Vulkan
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          for fex_icd in /usr/share/vulkan/icd.d/lvp*.json; do
            export VK_DRIVER_FILES="$fex_icd"
            break
          done
          cargo +1.98.1 test --locked --features ui-tests
      - name: Package
        run: |
          rustup default 1.98.1
          ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fex-linux-x86_64
          path: dist/fex-linux-x86_64.tar.gz
