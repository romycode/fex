[package]
name = "fex"
version = "0.1.0"
edition = "2024"
description = "POC: explorador de archivos para Linux con GPUI; objetivo < 200 ms al primer frame"
license = "MIT"

[dependencies]
# GPUI de Zed main (renderer wgpu en Linux). Fijado a un commit concreto: la API cambia a menudo.
gpui = { git = "https://github.com/zed-industries/zed", rev = "d2a4fb6ded7c470be25d1541281da3882495b65b" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "d2a4fb6ded7c470be25d1541281da3882495b65b", default-features = false, features = ["wayland"] }
futures = "0.3"
notify = "8"
# Papelera freedesktop (~/.local/share/Trash y .Trash-$UID por punto de montaje)
trash = { version = "5", default-features = false, features = ["freedesktop", "chrono"] }

# Zed parchea estas crates en su workspace; sin los mismos parches gpui no compila fuera de él.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
